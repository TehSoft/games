<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>TehSoft Games</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Az egész játékot és a gombot egy nagy közös keretbe fogjuk össze -->
    <div class="teljes-oldal">
        
        <header>
            <h1>Clicker</h1>
        </header>

        <!-- A két nagy panel (Grid elrendezéssel) -->
        <div class="Container">
            <div class="bal-oldal">
                <h2>Gomb:</h2>
                <p>Nyomd meg a gombot!</p>
                <button class="főgomb">Kattints rám!</button>
                <p class="szöveg">Pontszám: 0</p>

                <div class="reset-sor">
                    <button class="resetgomb">Reset</button>
                </div>
            </div>

            <aside class="jobb-panel">
                <h2>Fejlesztések:</h2>
                <div class="fejlesztes-elem">
                    <p class="szorzószöveg">Kattintásonként 1 pont</p>
                    <button class="szorzógomb">Fejlesztés ára: 20 pont</button>
                </div>
                <div class="fejlesztes-elem">
                    <p class="autoclickszöveg">Autoclick: 0 pont/mp</p>
                    <button class="autoclickgomb">Fejlesztés ára: 50 pont</button>
                </div>
            </aside>
            
        </div>

    </div>
</body>
</html>
